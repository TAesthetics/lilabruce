<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🏛️ Temple of the Wired</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="mobile-view">
    <div class="container mobile">
        <!-- Compact Header -->
        <header class="header mobile">
            <div class="header-title-bar">
                <h1 class="temple-title mobile">🏛️ Temple</h1>
                <div class="status-lights">
                    <span class="dot" id="father-dot" title="Father">🟣</span>
                    <span class="dot" id="layer1-dot" title="Layer1">⚫</span>
                    <span class="dot" id="layer2-dot" title="Layer2">⚪</span>
                </div>
            </div>
        </header>

        <!-- Main Content - Minimal, Mobile-First -->
        <main class="main-content mobile">
            <!-- Quick Status -->
            <section class="panel compact-panel">
                <div class="status-mini">
                    <div class="stat-row">
                        <span class="label">LOOP</span>
                        <span class="value" id="loop-status">Idle</span>
                    </div>
                    <div class="stat-row">
                        <span class="label">PHASE</span>
                        <span class="value" id="current-phase">-</span>
                    </div>
                </div>
            </section>

            <!-- Primary Controls - BIG BUTTONS -->
            <section class="panel controls-primary">
                <button class="btn btn-primary big" id="btn-loop-start">▶ START</button>
                <button class="btn btn-secondary big" id="btn-loop-stop">⏹ STOP</button>
            </section>

            <!-- Quick Agents - 4x Grid -->
            <section class="panel agents-quick">
                <button class="quick-agent" id="btn-recon" data-agent="recon">
                    <div class="agent-icon">🔍</div>
                    <div class="agent-label">Recon</div>
                </button>
                <button class="quick-agent" id="btn-exploit" data-agent="exploit">
                    <div class="agent-icon">⚔️</div>
                    <div class="agent-label">Exploit</div>
                </button>
                <button class="quick-agent" id="btn-detect" data-agent="detection">
                    <div class="agent-icon">🔔</div>
                    <div class="agent-label">Detect</div>
                </button>
                <button class="quick-agent" id="btn-harden" data-agent="hardening">
                    <div class="agent-icon">🛡️</div>
                    <div class="agent-label">Harden</div>
                </button>
            </section>

            <!-- Agent Status Compact -->
            <section class="panel agents-status-mini">
                <div class="agent-mini" id="agent-recon">
                    <div class="agent-dot">⚫</div>
                    <span class="agent-mini-name">Recon</span>
                    <span class="agent-mini-status">idle</span>
                </div>
                <div class="agent-mini" id="agent-exploit">
                    <div class="agent-dot">⚫</div>
                    <span class="agent-mini-name">Exploit</span>
                    <span class="agent-mini-status">idle</span>
                </div>
                <div class="agent-mini" id="agent-detection">
                    <div class="agent-dot">⚫</div>
                    <span class="agent-mini-name">Detect</span>
                    <span class="agent-mini-status">idle</span>
                </div>
                <div class="agent-mini" id="agent-hardening">
                    <div class="agent-dot">⚫</div>
                    <span class="agent-mini-name">Harden</span>
                    <span class="agent-mini-status">idle</span>
                </div>
            </section>

            <!-- Prayer Log - Scrollable -->
            <section class="panel logs-panel mobile">
                <h3 class="panel-title-mini">📜 Prayers</h3>
                <div class="log-container mobile" id="log-container">
                    <div class="log-entry">Awaiting prayers...</div>
                </div>
            </section>

            <!-- Results Tabs -->
            <section class="panel results-panel mobile">
                <div class="tabs-mobile">
                    <button class="tab-btn-mobile active" data-tab="recon">📊 Recon</button>
                    <button class="tab-btn-mobile" data-tab="exploit">⚔️ Exploit</button>
                    <button class="tab-btn-mobile" data-tab="detection">🔔 Detect</button>
                    <button class="tab-btn-mobile" data-tab="hardening">🛡️ Harden</button>
                </div>
                <div class="result-content mobile" id="recon-results">No results</div>
                <div class="result-content mobile hidden" id="exploit-results">No results</div>
                <div class="result-content mobile hidden" id="detection-results">No results</div>
                <div class="result-content mobile hidden" id="hardening-results">No results</div>
            </section>

            <!-- Bottom Action Bar -->
            <div class="action-bar-mobile">
                <button class="action-btn" id="btn-refresh">🔄 Refresh</button>
                <button class="action-btn" id="btn-clear-logs">🗑 Clear</button>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
